# Installed by regolith-linux-fedora/actions tools/install-fedora-workflows.sh
name: Fedora Publish to Unstable

on:
  workflow_dispatch:
  push:
    branches:
      - "fedora/**"

jobs:
  publish:
    uses: regolith-linux-fedora/actions/.github/workflows/fedora-publish-unstable.yml@fedora/main
    # The package (and its voulage package model entry) is i3status-rs,
    # not the repository name.
    with:
      name: i3status-rs
    secrets: inherit
